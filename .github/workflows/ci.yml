name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: make setup
      - run: npx playwright install --with-deps chromium
      - run: make check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-test-results
          path: test-results/
          retention-days: 7
  webkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: make setup
      - run: npx playwright install webkit
      - run: make test-webkit
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-test-results
          path: test-results/
          retention-days: 7
  verify:
    needs: [check, webkit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.check.result }} ${{ needs.webkit.result }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || { echo "::error::A test job finished with: $result"; exit 1; }
          done
  deploy:
    needs: [check, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://toms-crossing-exhibition.isaacvelando.com
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE_ARN: arn:aws:iam::634753796535:role/toms-crossing-exhibition-deploy
      BUCKET: toms-crossing-exhibition-site-634753796535
      DISTRIBUTION_ID: EB80S5K524DQD
      SITE_URL: https://toms-crossing-exhibition.isaacvelando.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: sanity-check build
        run: |
          for file in index.html 404.html 404.css robots.txt sitemap.xml og-image.png apple-touch-icon.png THIRD_PARTY_NOTICES.txt collection/catalog.json collection/layout.json collection/scene-assets.json; do
            test -s "dist/$file"
          done
          ls dist/assets/*.js dist/collection/assets/*.png dist/collection/previews/*.webp > /dev/null
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: upload
        run: |
          # Publish content-hashed files first and keep old versions for open tabs.
          for path in assets collection/assets collection/previews; do
            aws s3 sync "dist/$path/" "s3://$BUCKET/$path/" --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          done
          # Mutable documents revalidate; private source is never part of dist/.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude 'assets/*' --exclude 'collection/assets/*' --exclude 'collection/previews/*' \
            --cache-control 'public, max-age=0, must-revalidate' --only-show-errors
      - name: invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
      - name: check headers
        run: |
          curl -fsS -D headers.txt -o index.html "$SITE_URL/"
          csp=$(tr -d '\r' < headers.txt | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy: //p')
          test "$csp" = "$(tr -d '\n' < deploy/content-security-policy.txt)"
          grep -q '<title>Tom’s Crossing — An Unofficial Exhibition</title>' index.html
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke --project=desktop
        env:
          BASE_URL: https://toms-crossing-exhibition.isaacvelando.com
  # Runs on main started by a workflow (e.g. Dependabot merges) notify no one, so a
  # failure on main opens an issue, or comments on the one already open.
  alert:
    needs: [verify, deploy, smoke]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Production deploy failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - run: |
          body="Verify run $RUN_URL failed on main at $SHA. The live site may be stale or broken. Fix forward, or revert the change and let it redeploy."
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$TITLE" --body "$body"; fi
